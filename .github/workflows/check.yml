name: Check

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "installer/**", "packaging/**", ".github/workflows/check.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "installer/**", "packaging/**", ".github/workflows/check.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Design tokens (no raw colour literals outside PurgeTokens.xaml)
        run: node tools/token-lint.mjs
      - run: dotnet build src/PurgeWindows -c Release
      - run: dotnet test tests/PurgeWindows.Tests -c Release
      - name: No user-visible "Roomy" branding remains
        shell: pwsh
        run: |
          $files = "src/PurgeWindows/Localization/strings.json", "src/PurgeWindows/PurgeWindows.csproj", "installer/purge-windows.iss", "packaging/AppxManifest.xml"
          $hits = Select-String -Path $files -Pattern "roomy" -SimpleMatch
          if ($hits) { $hits | ForEach-Object { "::error file=$($_.Path),line=$($_.LineNumber)::Stale 'Roomy' branding" }; throw "Stale 'Roomy' branding found in user-visible files." }
